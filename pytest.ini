[pytest]
pythonpath = .
markers =
    integration: mark a test as an integration test
    performance: mark a test as a performance test
    live: hits public Horizon (read-only); run with RUN_LIVE_TESTS=1
addopts = 
    --cov=routers
    --cov=services
    --cov=other
    --cov=db
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=30
    -v
filterwarnings =
    ignore:The default datetime adapter is deprecated as of Python 3\.12:DeprecationWarning:aiosqlite\.core
