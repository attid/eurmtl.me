{% extends 'tabler_base.html' %}{% block page_title %}D2: Новый вопрос из шаблона{% endblock %}
{% block content %}
<div class="mb-1"><a href="/d2/fragment/edit?status=active">← К списку вопросов</a></div>
<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-vcenter card-table">
                <thead>
                    <tr>
                        <th>Шаблон</th>
                        <th>Текст</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in templates %}
                    <tr>
                        <td>{{ row.title }}</td>
                        <td class="text-secondary">{{ row.body | striptags }}</td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-primary"
                               href="/d2/fragment/form?template_id={{ row.id }}">Выбрать</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-secondary">Шаблонов нет.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
