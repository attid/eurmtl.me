<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-vcenter card-table">
                <thead>
                    <tr>
                        <th>Номер</th>
                        <th>Тема</th>
                        <th>Чтение</th>
                        <th>Статус</th>
                        <th>Чтений</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in items %}
                    <tr {% if current_uuid and row.uuids %}class="{{ 'table-primary' if current_uuid in row.uuids else '' }}"{% endif %}>
                        <td>{% if current_uuid and current_uuid in row.uuids %}<span class="badge bg-primary-lt">редактируемое</span> {% endif %}{{ row.number }}</td>
                        <td><a href="/d2/{{ row.first_uuid }}">{{ row.title }}</a></td>
                        <td>{{ row.reading }}</td>
                        <td>{{ row.status }}</td>
                        <td>{{ row.readings_count }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="text-secondary">Нет данных.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
